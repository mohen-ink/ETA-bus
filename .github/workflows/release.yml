name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepare signing and keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少签名密钥，请在仓库 Secrets 中配置 KEYSTORE_BASE64 等变量"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/etabus-release.p12
          {
            echo "storeFile=keystore/etabus-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "AMAP_API_KEY=$AMAP_API_KEY"
          } > local.properties

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PabiFilters=arm64-v8a \
            -PversionName="$VERSION" \
            -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ETA-bus-${GITHUB_REF_NAME}-arm64-v8a.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
